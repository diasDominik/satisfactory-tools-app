name: Android release

# Builds a signed Play Store bundle. Run it by hand, or push a tag such as v1.0.0.
# Needs the repository secrets described in RELEASING.md.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      track:
        description: Play Console track to upload to (needs PLAY_SERVICE_ACCOUNT_JSON), or none to only build
        required: true
        default: none
        type: choice
        options: [ none, internal, alpha, beta, production ]

jobs:
  bundle:
    name: Signed release bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches app.versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep '^app.versionName=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.versionName=$version in gradle.properties"
            exit 1
          fi

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set, see RELEASING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed bundle
        env:
          SFT_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          SFT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SFT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SFT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: satisfactory-tools-release
          path: |
            androidApp/build/outputs/bundle/release/*.aab
            androidApp/build/outputs/mapping/release/mapping.txt

      - name: Attach bundle to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: androidApp/build/outputs/bundle/release/*.aab

      - name: Upload to Google Play
        if: inputs.track != '' && inputs.track != 'none'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.diasdominik.sft
          releaseFiles: androidApp/build/outputs/bundle/release/*.aab
          mappingFile: androidApp/build/outputs/mapping/release/mapping.txt
          track: ${{ inputs.track }}
          status: ${{ inputs.track == 'production' && 'draft' || 'completed' }}
