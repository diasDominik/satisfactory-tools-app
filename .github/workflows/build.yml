name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  android-and-desktop:
    name: Tests, Android and desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :shared:jvmTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icon-sheet
          path: |
            shared/build/icon-sheet.png
            shared/build/layout.png
      - name: Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace
      - name: Android release build (unsigned, checks R8 and lint)
        run: ./gradlew :androidApp:bundleRelease --stacktrace
      - name: Desktop app
        run: ./gradlew :desktopApp:assemble --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: satisfactory-tools-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: iOS simulator build
        run: cd iosApp && xcodebuild -scheme iosApp -configuration Debug -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED='NO'

  desktop-installers:
    name: Desktop installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Package
        shell: bash
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: satisfactory-tools-desktop-${{ runner.os }}
          path: desktopApp/build/compose/binaries/main/*/*
